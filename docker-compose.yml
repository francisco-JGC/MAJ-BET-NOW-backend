services:
  postgres:
    image: postgres:16-alpine
    container_name: majbetnow-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-majbetnow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-majbetnow}
      POSTGRES_DB: ${DB_NAME:-majbetnow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-majbetnow} -d ${DB_NAME:-majbetnow}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: majbetnow_postgres_data
